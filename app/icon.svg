<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" fill-rule="evenodd" clip-rule="evenodd">
  <!--
    The favicon, from public/logos/steve.svg.

    Two changes from the source file, both made for the 16px case, which is the
    only size that actually decides whether a favicon works.

    A rounded near-black tile rather than the source's square white one. Tried
    three ways and looked at all of them at 16 and 32 on a light and a dark tab
    strip: the mark on its own, with the white ground stripped, is a black glyph
    on transparent and it disappears into a dark tab strip entirely. A white
    tile survives both, but at 16px the tile is most of what you see and the
    glyph shrinks to nothing. The dark tile reads on a light strip because it
    pops, and on a dark strip because the mark is the light part.

    And the mark is scaled up to fill the tile. The source art carries a lot of
    its own margin inside the square, and rounding adds more — at 16px that left
    a glyph of about six pixels. The transform re-centres the mark's real
    bounding box and scales it to a 14% margin.

    #141414 is the app's own near-black, the same ground the opengraph card
    uses, so a shared link and the tab it opens in are the same object.
  -->
  <rect width="1254" height="1254" rx="280" fill="#141414"/>
  <g fill="#fdfdfd" transform="translate(627 627) scale(1.18) translate(-674 -595) matrix(1.224609,0,0,1.224609,0,0)">
    <path d="M582.456,174.042C600.42,172.773 620.252,173.718 640.863,189.005C644.383,191.616 663.795,206.014 668.034,236.573C681.076,330.579 559.988,394.831 484.619,470.617C438.086,517.408 454.974,544.289 469.67,549.004C500.598,558.927 512.748,508.059 541.695,472.649C617.522,379.894 693.952,399.843 705.529,402.372C748.19,411.69 775.215,442.871 784.382,463.556C853.922,620.467 641.439,770.217 486.406,798.038C307.307,830.177 306.84,714.337 351.837,679.925C412.084,633.851 480.186,661.211 575.542,648.796C638.358,640.617 675.314,609.221 687.096,580.331C707.551,530.174 665.637,494.725 614.46,507.35C552.897,522.536 534.576,573.975 504.84,594.992C464.44,623.547 419.885,608.565 404.81,552.41C387.977,489.707 415.383,189.146 582.456,174.042Z"/>
    <path d="M314.501,666.944C247.452,663.794 283.965,525.02 343.496,523.347C375.719,522.441 383.463,567.86 375.022,600.377C374.57,602.119 359.565,664.281 314.501,666.944Z"/>
  </g>
</svg>
