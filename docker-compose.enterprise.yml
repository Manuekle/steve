# Enterprise self-hosted stack, packaged as containers instead of the
# Ansible + systemd path in deploy/. Same three processes either way —
# PostgreSQL, the eve agent host, the Next.js UI — see README.md's
# architecture diagram and deploy/README.md for the systemd equivalent.
#
# Quick start:
#   cp .env.example .env   # fill in model keys, channel credentials, passwords
#   docker compose -f docker-compose.enterprise.yml up -d --build postgres eve
#   docker compose -f docker-compose.enterprise.yml run --rm eve node_modules/.bin/bootstrap
#   docker compose -f docker-compose.enterprise.yml up -d
#
# That middle step creates the Workflow schema in Postgres — `eve` boot-loops
# without it (verified: it fails with "relation workflow.workflow_runs does
# not exist" until the schema exists). Same one-time step README.md already
# documents as `pnpm db:migrate` for the Ansible path; here it runs inside
# the `eve` image instead of on the host, since the image ships no pnpm.
#
# This file is deliberately independent of docker-compose.yml (which only
# runs Postgres, for local `pnpm dev`) — run one or the other, not both, to
# avoid two Postgres containers fighting over the same host port.
#
# No service pins a `container_name`, and the two host ports are variables.
# Both are deliberate. Container names are global to a Docker host, so a
# pinned one caps this file at a single stack per machine; without it Compose
# names each container after its project (`-p`), which is what lets one host
# serve several isolated stacks — a tenant each, volumes included:
#
#   docker compose -p acme -f docker-compose.enterprise.yml up -d
#   EVE_HOST_PORT=3010 WEB_HOST_PORT=3011 \
#     docker compose -p globex -f docker-compose.enterprise.yml up -d
#
# Nothing reads the old names: app/api/setup/route.ts looks for
# `steve-postgres`, but only when WORKFLOW_POSTGRES_URL resolves to a local
# host. Here it points at the `postgres` service name, which
# lib/postgres-target.ts classifies `remote`, so that check is skipped.
#
# Give each tenant its own database rather than its own Postgres container —
# point WORKFLOW_POSTGRES_URL at a shared server and leave the `postgres`
# service stopped. Same isolation, a fraction of the memory.
#
# Docker socket trust boundary: `eve` mounts /var/run/docker.sock so
# agent/sandbox/sandbox.ts's Docker backend can create sibling sandbox
# containers on the host daemon. That is the standard pattern for
# container-based CI/agent runners, but it is not a sandboxed permission —
# a process with the host socket can control anything else the host's
# Docker daemon can. Only run the `eve` image on a host where that's an
# acceptable trust boundary, and never expose port 3000 beyond loopback (the
# reverse proxy is the one thing that should reach it).

name: steve-enterprise

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-world}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-world}"
      POSTGRES_DB: "${POSTGRES_DB:-world}"
    volumes:
      - steve-enterprise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  eve:
    build:
      context: .
      target: eve
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever WORKFLOW_POSTGRES_URL says in .env — inside this
      # network Postgres is reachable by service name, not by the host-port
      # binding (127.0.0.1:5544) that .env is written for local dev.
      WORKFLOW_POSTGRES_URL: "postgres://${POSTGRES_USER:-world}:${POSTGRES_PASSWORD:-world}@postgres:5432/${POSTGRES_DB:-world}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Everything the app keeps outside Postgres: contacts, chats, agents,
      # forms, automations, saved credentials, the license and the
      # installation id. lib/business-store.ts states the invariant —
      # "both processes read ~/.steve/business.json" — so `eve` and `web`
      # must mount the *same* volume, not one each. Without it the agent
      # writes contacts the inbox cannot see, and every `up --build`
      # discards the lot: a new installation id breaks the license binding
      # and resets the credit ledger's organizationId.
      # Both images run as root, so $HOME is /root.
      - steve-enterprise-data:/root/.steve
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EVE_HOST_PORT:-3000}:3000"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    # The Next.js side needs the same environment `eve` does, and used to get
    # none of it. Every /api route runs in this container: lib/credits-db.ts
    # and lib/billing/db-store.ts *throw* without WORKFLOW_POSTGRES_URL, which
    # took out /api/credits/balance and both /api/usage routes; auth and
    # billing-store silently fell back to their file stores while `eve` used
    # the database; describePostgresTarget(undefined) made /setup run the
    # Docker checks and report a missing container; and with no model key in
    # the environment /api/health reported ai:false on a working install.
    #
    # NEXT_PUBLIC_* is not covered here — Next inlines those at build time, so
    # NEXT_PUBLIC_SITE_URL has to be a build arg, not a runtime variable.
    env_file: .env
    environment:
      # Same override, same reason as `eve` above.
      WORKFLOW_POSTGRES_URL: "postgres://${POSTGRES_USER:-world}:${POSTGRES_PASSWORD:-world}@postgres:5432/${POSTGRES_DB:-world}"
    volumes:
      # The same volume `eve` mounts — see the comment there.
      - steve-enterprise-data:/root/.steve
    depends_on:
      postgres:
        condition: service_healthy
      eve:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3001}:3001"

  # Not included: a reverse proxy with TLS. deploy/roles/caddy/templates/Caddyfile.j2
  # is the reference config (routes /eve/* and /.well-known/workflow/* to
  # :3000, everything else to :3001) — it's Jinja-templated for Ansible, so
  # turning it into a static Caddyfile for this compose file means filling
  # in the real domain and ACME email by hand, which only the deploying
  # operator can do.

volumes:
  steve-enterprise-pgdata:
  steve-enterprise-data:
